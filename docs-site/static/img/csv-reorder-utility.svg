<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Reorder CSV columns only when a downstream loader uses field positions</title>
  <desc id="desc">A CSV with correct header names can be validated in any column order. The reorder utility reads the canonical order from OMOP DDL and writes a new CSV for positional database loading while keeping existing values attached to their header names.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#b45309"/>
    </marker>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="145%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .ddl { fill: #fffaf0; stroke: #f59e0b; stroke-width: 1.5; filter: url(#shadow); }
      .utility { fill: #0f766e; stroke: #115e59; stroke-width: 2; filter: url(#shadow); }
      .output { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; filter: url(#shadow); }
      .validation { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.5; filter: url(#shadow); }
      .loading { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.5; filter: url(#shadow); }
      .title { font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .eyebrow { font: 800 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .label { font: 800 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 600 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .table-order { font: 800 10px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .table-head { font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .table-value { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0f172a; }
      .utility-eyebrow { font: 800 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ccfbf1; }
      .utility-label { font: 800 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
      .utility-body { font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ecfeff; }
      .badge { font: 800 10px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #115e59; }
      .divider { stroke: #d7e0e7; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      .arrow-slate { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow-slate); }
      .arrow-teal { fill: none; stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow-teal); }
      .arrow-amber { fill: none; stroke: #b45309; stroke-width: 3; marker-end: url(#arrow-amber); }
      .dash { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>

  <text x="60" y="52" class="title">Reorder only when column position matters</text>
  <text x="60" y="83" class="subtitle">Validation uses header names. Some database loaders use field positions.</text>
  <path d="M60 111 H1140" class="divider"/>

  <rect x="405" y="132" width="390" height="96" rx="8" class="ddl"/>
  <text x="432" y="160" class="eyebrow">ORDER SOURCE</text>
  <text x="432" y="190" class="label">PERSON columns in the DDL</text>
  <text x="432" y="214" class="small">1 person_id  |  2 gender_concept_id  |  3 year_of_birth</text>

  <path d="M600 230 V250" class="arrow-slate dash"/>

  <rect x="60" y="260" width="340" height="200" rx="8" class="card"/>
  <text x="84" y="287" class="eyebrow">INPUT</text>
  <text x="84" y="315" class="label">CSV from the ETL</text>
  <rect x="84" y="330" width="292" height="96" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="84" y="330" width="292" height="22" rx="4" fill="#e2e8f0"/>
  <rect x="84" y="352" width="292" height="40" fill="#f1f5f9"/>
  <path d="M84 352 H376 M84 392 H376 M170 330 V426 M252 330 V426" class="grid"/>
  <text x="127" y="345" class="table-order" text-anchor="middle">POSITION 1</text>
  <text x="211" y="345" class="table-order" text-anchor="middle">POSITION 2</text>
  <text x="314" y="345" class="table-order" text-anchor="middle">POSITION 3</text>
  <text x="127" y="377" class="table-head" text-anchor="middle">year_of_birth</text>
  <text x="211" y="377" class="table-head" text-anchor="middle">person_id</text>
  <text x="314" y="377" class="table-head" text-anchor="middle">gender_concept_id</text>
  <text x="127" y="414" class="table-value" text-anchor="middle">1963</text>
  <text x="211" y="414" class="table-value" text-anchor="middle">1</text>
  <text x="314" y="414" class="table-value" text-anchor="middle">8532</text>
  <text x="84" y="448" class="body">Correct headers, different positions</text>

  <rect x="455" y="260" width="290" height="200" rx="8" class="utility"/>
  <text x="485" y="289" class="utility-eyebrow">DDL-DRIVEN UTILITY</text>
  <text x="485" y="324" class="utility-label">reorder-csv.pl</text>
  <circle cx="490" cy="354" r="4" fill="#ccfbf1"/>
  <text x="504" y="359" class="utility-body">Read order from DDL</text>
  <circle cx="490" cy="386" r="4" fill="#ccfbf1"/>
  <text x="504" y="391" class="utility-body">Match columns by header</text>
  <circle cx="490" cy="418" r="4" fill="#ccfbf1"/>
  <text x="504" y="423" class="utility-body">Write a reordered copy</text>
  <rect x="485" y="432" width="230" height="22" rx="6" fill="#ccfbf1"/>
  <text x="600" y="447" class="badge" text-anchor="middle">INPUT FILE IS NOT MODIFIED</text>

  <rect x="800" y="260" width="340" height="200" rx="8" class="output"/>
  <text x="824" y="287" class="eyebrow">OUTPUT</text>
  <text x="824" y="315" class="label">Reordered CSV</text>
  <rect x="824" y="330" width="292" height="96" rx="4" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1"/>
  <rect x="824" y="330" width="292" height="22" rx="4" fill="#dbeafe"/>
  <rect x="824" y="352" width="292" height="40" fill="#eff6ff"/>
  <path d="M824 352 H1116 M824 392 H1116 M906 330 V426 M1030 330 V426" class="grid"/>
  <text x="865" y="345" class="table-order" text-anchor="middle">POSITION 1</text>
  <text x="968" y="345" class="table-order" text-anchor="middle">POSITION 2</text>
  <text x="1073" y="345" class="table-order" text-anchor="middle">POSITION 3</text>
  <text x="865" y="377" class="table-head" text-anchor="middle">person_id</text>
  <text x="968" y="377" class="table-head" text-anchor="middle">gender_concept_id</text>
  <text x="1073" y="377" class="table-head" text-anchor="middle">year_of_birth</text>
  <text x="865" y="414" class="table-value" text-anchor="middle">1</text>
  <text x="968" y="414" class="table-value" text-anchor="middle">8532</text>
  <text x="1073" y="414" class="table-value" text-anchor="middle">1963</text>
  <text x="824" y="448" class="body">Same values, DDL positions</text>

  <path d="M400 360 H447" class="arrow-teal"/>
  <path d="M745 360 H792" class="arrow-teal"/>
  <path d="M230 462 V517" class="arrow-slate dash"/>
  <path d="M970 462 V517" class="arrow-amber"/>

  <rect x="60" y="525" width="500" height="100" rx="8" class="validation"/>
  <circle cx="96" cy="575" r="22" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M86 575 L93 582 L107 567" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="553" class="eyebrow" fill="#166534">VALIDATION</text>
  <text x="132" y="582" class="label">Order does not matter</text>
  <text x="132" y="608" class="body">Headers identify which value belongs to each field.</text>

  <rect x="640" y="525" width="500" height="100" rx="8" class="loading"/>
  <circle cx="676" cy="575" r="22" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="676" y="580" class="label" fill="#9a3412" text-anchor="middle">#</text>
  <text x="712" y="553" class="eyebrow" fill="#9a3412">POSITIONAL LOAD</text>
  <text x="712" y="582" class="label">Order can matter</text>
  <text x="712" y="608" class="body">Some loaders map fields by position instead of header name.</text>
</svg>
