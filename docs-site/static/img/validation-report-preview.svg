<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">OMOP CSV Validator result preview</title>
  <desc id="desc">A visual preview of command-line validation output and a spreadsheet-style validation report with OK and ERROR rows.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #dbe3ec; stroke-width: 1.5; rx: 18; filter: url(#shadow); }
      .label { font: 800 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 500 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 700 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0.06em; text-transform: uppercase; }
      .term { fill: #111827; rx: 14; }
      .dot-red { fill: #ef4444; }
      .dot-yellow { fill: #f59e0b; }
      .dot-green { fill: #22c55e; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e5edf5; }
      .mono-dim { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #94a3b8; }
      .mono-ok { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #86efac; }
      .mono-bad { font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #fca5a5; }
      .sheet-head { fill: #0f766e; }
      .sheet-head-text { font: 800 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .cell { fill: #ffffff; stroke: #dbe3ec; stroke-width: 1; }
      .cell-alt { fill: #f8fafc; stroke: #dbe3ec; stroke-width: 1; }
      .cell-text { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .status-ok { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
      .status-error { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1; }
      .status-ok-text { font: 800 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #166534; }
      .status-error-text { font: 800 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #991b1b; }
      .callout { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 16; }
      .callout-text { font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9a3412; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="640"/>
  <text x="72" y="78" class="title">Validation results</text>
  <text x="72" y="112" class="subtitle">Read the result in the terminal or write a row-level spreadsheet report.</text>

  <rect x="72" y="166" width="448" height="362" class="panel"/>
  <text x="104" y="208" class="tiny">Command line</text>
  <text x="104" y="238" class="label">Terminal output</text>
  <rect x="104" y="268" width="384" height="214" class="term"/>
  <circle cx="128" cy="292" r="7" class="dot-red"/>
  <circle cx="150" cy="292" r="7" class="dot-yellow"/>
  <circle cx="172" cy="292" r="7" class="dot-green"/>
  <text x="126" y="332" class="mono-dim">$ omop-csv-validator ...</text>
  <text x="126" y="366" class="mono-ok">PERSON.csv checked</text>
  <text x="126" y="400" class="mono-bad">1 row failed validation</text>
  <text x="126" y="434" class="mono">Report saved:</text>
  <text x="126" y="460" class="mono">validation-report.xlsx</text>

  <rect x="578" y="166" width="550" height="362" class="panel"/>
  <text x="610" y="208" class="tiny">Spreadsheet report</text>
  <text x="610" y="238" class="label">Filter by row status</text>

  <rect x="610" y="270" width="486" height="42" class="sheet-head"/>
  <text x="628" y="296" class="sheet-head-text">person_id</text>
  <text x="748" y="296" class="sheet-head-text">year</text>
  <text x="836" y="296" class="sheet-head-text">status</text>
  <text x="946" y="296" class="sheet-head-text">message</text>

  <rect x="610" y="312" width="120" height="42" class="cell"/>
  <rect x="730" y="312" width="88" height="42" class="cell"/>
  <rect x="818" y="312" width="110" height="42" class="status-ok"/>
  <rect x="928" y="312" width="168" height="42" class="cell"/>
  <text x="628" y="338" class="cell-text">1</text>
  <text x="748" y="338" class="cell-text">1963</text>
  <text x="848" y="338" class="status-ok-text">OK</text>
  <text x="946" y="338" class="cell-text">-</text>

  <rect x="610" y="354" width="120" height="42" class="cell-alt"/>
  <rect x="730" y="354" width="88" height="42" class="cell-alt"/>
  <rect x="818" y="354" width="110" height="42" class="status-error"/>
  <rect x="928" y="354" width="168" height="42" class="cell-alt"/>
  <text x="628" y="380" class="cell-text">A17</text>
  <text x="748" y="380" class="cell-text">1981</text>
  <text x="836" y="380" class="status-error-text">ERROR</text>
  <text x="946" y="380" class="cell-text">Expected integer</text>

  <rect x="610" y="396" width="120" height="42" class="cell"/>
  <rect x="730" y="396" width="88" height="42" class="cell"/>
  <rect x="818" y="396" width="110" height="42" class="status-ok"/>
  <rect x="928" y="396" width="168" height="42" class="cell"/>
  <text x="628" y="422" class="cell-text">3</text>
  <text x="748" y="422" class="cell-text">1974</text>
  <text x="848" y="422" class="status-ok-text">OK</text>
  <text x="946" y="422" class="cell-text">-</text>

  <rect x="610" y="458" width="210" height="42" class="callout"/>
  <text x="632" y="484" class="callout-text">Filter to ERROR rows</text>
  <rect x="848" y="458" width="248" height="42" class="callout"/>
  <text x="870" y="484" class="callout-text">Inspect the source values</text>

  <text x="104" y="570" class="body">The report contains the input values, row status, and validation message.</text>
</svg>
